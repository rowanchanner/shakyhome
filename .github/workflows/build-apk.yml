name: Build Sharky Home APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sharky-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore permanent app signing key
        env:
          SIGNING_KEY: ${{ secrets.SHARKY_SIGNING_KEY }}
        run: |
          test -n "$SIGNING_KEY"
          mkdir -p .signing
          printf '%s' "$SIGNING_KEY" | base64 --decode > .signing/sharky.jks
      - name: Build debug APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test launcher on Android 11 (Fire OS 8 base)
        uses: reactivecircus/android-emulator-runner@v2
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        with:
          api-level: 30
          arch: x86_64
          profile: Nexus 7
          disable-animations: true
          script: |
            ./gradlew connectedDebugAndroidTest
            adb shell am start -n com.sharky.home/.MainActivity
            sleep 2
            adb shell screencap -p /sdcard/sharky-home.png
            adb pull /sdcard/sharky-home.png app/build/reports/androidTests/sharky-home.png
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: launcher-test-results
          path: app/build/reports/androidTests/
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sharky Home — latest
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
